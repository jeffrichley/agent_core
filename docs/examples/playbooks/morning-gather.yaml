# Morning brief — gather config example.
#
# Referenced from morning-brief.md's `gather_config:` metadata key. The
# orchestrator loads this YAML, runs each fetcher entry against the
# registered fetcher catalog, and merges their output under `namespace`
# in the gather context the playbook sees.
#
# `${agent_root}` is substituted at parse time using the orchestrator's
# `vars.agent_root`. `{{ ... }}` substitutions belong in destinations,
# not here — gather config runs once, before delivery.
#
# Three of the four fetchers below use built-ins shipped with the briefs
# package: `cli`, `filesystem_read`, and `now`. The fourth (`email_stub`)
# is an agent-side example fetcher under `docs/examples/fetchers/` that
# keeps the example runnable without a real email integration. Drop your
# own `.py` modules into one of the orchestrator's `fetcher_paths`
# directories to add more — they're picked up on next gather without an
# install step.
#
# Place at `${agent_root}/Memory/gather/morning.yaml`.

fetchers:
  # Built-in: time/calendar facts. The morning-brief playbook gates
  # `weekly_digest` and `war_pointer` conditional sections on `now.is_friday`
  # and `now.is_weekly_digest_day` — without this fetcher both expressions
  # crash. `weekly_digest_day` defaults to Monday; override via config.
  - type: now
    namespace: now
    timeout_seconds: 5
    config:
      timezone: America/New_York

  # Built-in: read a local YAML/JSON/text file into the context.
  - type: filesystem_read
    namespace: projects
    timeout_seconds: 10
    config:
      path: "${agent_root}/Memory/projects/active.yaml"
      format: yaml

  # Built-in: shell out to a CLI and parse stdout.
  - type: cli
    namespace: calendar
    timeout_seconds: 30
    config:
      command:
        - "gcalcli"
        - "agenda"
        - "--nocolor"
        - "--details"
        - "time"
      parse: text
      env_passthrough:
        - PATH
        - PATHEXT
        - SYSTEMROOT
        - USERPROFILE

  # Agent-side example: stub email fetcher. Swap with a real client when
  # ready. Source: `docs/examples/fetchers/email_stub.py`. Add the
  # containing directory to the orchestrator's `fetcher_paths` so it's
  # discoverable.
  - type: email_stub
    namespace: email
    timeout_seconds: 5
    config: {}
