# Pepper — agent_core.yaml
#
# Pipeline configuration for Pepper (Jeff Richley's EA / Second Brain).
# Place this file at the root of Pepper's project directory.
#
# How it works:
#   1. SessionStart: TimeInjector tells Pepper what time it is, then
#      one IdentityInjector per identity file (critical first), then a
#      HandoffInjector that consults the sidecar status file before loading
#      handoff.md.
#   2. UserPromptSubmit: TimeInjector fires again with track_session=true so
#      the current time stays fresh on every turn (re-anchors against drift)
#      and emits "Session started Xm ago" / "Last user turn Ym ago" deltas.
#   3. PreCompact/SessionEnd: HandoffWriter enqueues a daemon job. The daemon
#      worker generates handoff.md and writes handoff-status.json.
#   4. pre_publish: every envelope on the bus (Discord inbound, Pepper's
#      replies, scheduler triggers, agent-to-agent) is appended to
#      ~/.agent-core/bus/raw/<date>.jsonl. Pepper's 3 AM reflection job
#      reads this log via agent_core.bus_log.iter_for_agent.
#
# .claude/settings.json hooks should point to:
#   "command": "uv run agent-core hooks run SessionStart"
#   "command": "uv run agent-core hooks run UserPromptSubmit"
#   "command": "uv run agent-core hooks run PreCompact"
#   "command": "uv run agent-core hooks run SessionEnd"

bus:
  storage_path: "C:\\Users\\jeffr\\.pepper\\agent-core\\bus.sqlite"

http:
  bind_host: "127.0.0.1"
  bind_port: 8788

endpoints:
  - type: builtin.handoff_jobs
    name: handoff-jobs
    params:
      mount: /internal/handoff-jobs

  - type: builtin.claude_code_mcp
    name: pepper
    params:
      mount: /mcp/pepper
      # Cutover #04: bus_log_root defaults to ~/.agent-core/bus/raw
      # (matches builtin.daily_raw_jsonl writer). Override here only if
      # the daemon writes the log somewhere non-default.
      #
      # Cutover #09 (T19): naming the briefs orchestrator here mounts
      # the seven briefs agent tools (compose_brief, list_sections,
      # get_section_spec, validate_section, compress_sections,
      # add_extension_section, submit_brief) onto Pepper's MCP session
      # via cross-endpoint wiring at runner construction time. The
      # orchestrator must be registered as a sibling endpoint below.
      briefs_orchestrator: briefs.orchestrator

  # Cutover #09: brief framework orchestrator. Listens for BriefRequest
  # events on the bus, runs the playbook's gather config (loaded from
  # `<playbooks_path>/<brief_type>.md`), and publishes a ComposeBrief
  # envelope back to `default_target_agent` (Pepper). The agent then
  # composes the brief content via the registered MCP tool surface
  # (T14) and submits it via T13.
  #
  # `fetcher_paths` is the runner-friendly path: the orchestrator
  # discovers fetchers on construction via `discover_implementations`.
  # In-process callers (tests, the briefs CLI) use the alternative
  # `fetcher_catalog=` constructor kwarg instead.
  #
  # `vars.agent_root` anchors `${agent_root}/...` substitutions in the
  # playbook + gather YAMLs. T16 wires this entry through pluggy
  # (`agent_core_briefs.plugin.register_endpoint_types`); the briefs
  # subsystem is contributed via entry-points, not a hard dep on core.
  - type: builtin.briefs_orchestrator
    name: briefs.orchestrator
    params:
      playbooks_path: "C:\\Users\\jeffr\\.pepper\\Memory\\playbooks"
      fetcher_paths:
        - "C:\\Users\\jeffr\\.pepper\\Memory\\briefs\\fetchers"
      # T19 (cutover #09): destination_paths and audit_log_path are
      # optional — both default to sensible values (built-in
      # destinations + ~/.agent-core/briefs/audit.jsonl). Listed
      # explicitly so operators see the knobs.
      # NOTE: built-in `discord_embed` and `markdown_file` are auto-loaded
      # from the package; operator-supplied paths add NEW destinations only
      # and cannot redefine a built-in `type_id` (duplicate raises LoaderError).
      destination_paths:
        - "C:\\Users\\jeffr\\.pepper\\Memory\\briefs\\destinations"
      audit_log_path: "C:\\Users\\jeffr\\.agent-core\\briefs\\audit.jsonl"
      vars:
        agent_root: "C:\\Users\\jeffr\\.pepper"
      default_target_agent: "pepper"

bus_hooks:
  pre_publish:
    # Cutover #04: every published envelope (Discord, scheduler, relay,
    # cross-agent) lands as JSONL in the daemon-owned daily log. Each
    # agent's reflection job (Pepper's 3 AM cron) filters this log to
    # its perspective via agent_core.bus_log.iter_for_agent. Defaults:
    # log_root ~/.agent-core/bus/raw, timezone US/Eastern, skip_kinds
    # ["Acknowledgment","Progress","Cancellation"].
    - type: builtin.daily_raw_jsonl
      params: {}

pipelines:
  SessionStart:
    - type: builtin.time_injector
      params:
        format: "%A, %B %d, %Y %I:%M %p %Z"

    - type: builtin.identity_injector
      params:
        base_path: "C:\\Users\\jeffr\\.pepper\\Memory"
        files:
          - "SOUL.md"
        heading: "Identity — Critical Core"
        missing_file_behavior: "error"

    - type: builtin.identity_injector
      params:
        base_path: "C:\\Users\\jeffr\\.pepper\\Memory"
        files:
          - "IDENTITY.md"
        heading: "Identity — Self-model"
        missing_file_behavior: "warn"

    - type: builtin.identity_injector
      params:
        base_path: "C:\\Users\\jeffr\\.pepper\\Memory"
        files:
          - "pepper/preferences.md"
        heading: "Identity — Preferences"
        missing_file_behavior: "warn"

    - type: builtin.handoff_injector
      params:
        base_path: "C:\\Users\\jeffr\\.pepper\\Memory"
        files:
          - "pepper/handoff.md"
        heading: "Continuity"
        missing_file_behavior: "warn"

  UserPromptSubmit:
    # Re-fires every turn so the current time stays fresh and the agent
    # gets relative-time deltas to re-anchor against drift. track_session
    # persists per-session timestamps to ~/.agent_core/time-state.json.
    - type: builtin.time_injector
      params:
        format: "%A, %B %d, %Y %I:%M %p %Z"
        track_session: true

  PreCompact:
    - type: builtin.handoff_writer
      params:
        output_path: "C:\\Users\\jeffr\\.pepper\\Memory\\pepper\\handoff.md"
        vault_root: "C:\\Users\\jeffr\\.pepper\\Memory\\pepper"
        handoff_status_path: "C:\\Users\\jeffr\\.pepper\\Memory\\pepper\\handoff-status.json"
        handoff_jobs_url: "http://127.0.0.1:8788/internal/handoff-jobs"
        agent_name: "Pepper"

  SessionEnd:
    - type: builtin.handoff_writer
      params:
        output_path: "C:\\Users\\jeffr\\.pepper\\Memory\\pepper\\handoff.md"
        vault_root: "C:\\Users\\jeffr\\.pepper\\Memory\\pepper"
        handoff_status_path: "C:\\Users\\jeffr\\.pepper\\Memory\\pepper\\handoff-status.json"
        handoff_jobs_url: "http://127.0.0.1:8788/internal/handoff-jobs"
        agent_name: "Pepper"
