[project]
name = "agent-core-webcam"
dynamic = ["version"]
description = "Webcam endpoint for agent_core — agent-driven on-demand frame capture"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "agent-core-bus>=0.8,<0.9",
    "fastmcp>=2.0",
    "opencv-python>=5.0.0.93",
    "pluggy>=1.6",
    "pydantic>=2.7",
]

[project.entry-points."agent_core"]
webcam_aliases = "agent_core_webcam.plugin"

[project.optional-dependencies]
# Heavy CV recognition stack — kept OUT of the base install so the presence
# hook stays tiny. Imported lazily; never pulled in by the hook path.
recognition = [
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core_webcam"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
