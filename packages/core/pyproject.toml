[project]
name = "agent-core-bus"
dynamic = ["version"]
description = "Core infrastructure for AI agents - memory, knowledge compilation, and tooling"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.29",
    "agent-core-credentials>=0.8,<0.9",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "agentmail>=0.4",
    "aiosqlite>=0.20",
    "fastmcp>=2.0",
    "starlette>=1.3.1",
    "uvicorn>=0.30",
    "cryptography>=42.0",
    "PyJWT[crypto]>=2.8",
    "psutil>=5.9",
    "apscheduler>=4.0.0a5",
    "sqlalchemy>=2.0",
    "sniffio>=1.3",
    "pluggy>=1.6",
    "pywin32>=300; sys_platform == 'win32'",
]

[project.scripts]
agent-core = "agent_core.cli:app"
agent-core-daemon = "agent_core.daemon.cli:app"

[project.entry-points."agent_core"]
aliases = "agent_core.plugins.builtin_aliases"
example = "agent_core.plugins.example_entrypoint"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
# Force-include agent_core.venv. It is a SOURCE subpackage whose name collides
# with the root .gitignore's `venv/` pattern, and the rescue negation there
# (`!packages/core/src/agent_core/venv/`) is written REPO-root-relative. That
# path does not exist inside an sdist, whose root is this package — so when the
# release builds the wheel FROM the sdist (`uv build` without `--wheel`, as
# .github/workflows/release.yml does), the broad ignore matches and the negation
# misses. The subpackage is silently dropped and `agent_core.cli` dies at import
# on every clean install. See #566.
artifacts = ["src/agent_core/venv/**"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
