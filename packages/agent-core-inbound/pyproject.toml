[project]
name = "agent-core-inbound"
dynamic = ["version"]
description = "Inbound notifications router — deny-by-default external-event surface for agent-core beings."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "agent-core",
    "pydantic>=2.13.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "watchdog>=4.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.entry-points."agent_core"]
inbound_aliases = "agent_core_inbound.plugin"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core_inbound"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
agent-core = { workspace = true }
