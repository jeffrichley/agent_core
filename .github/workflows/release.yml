name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.12"

      - name: Build wheels and sdists for all 12 packages
        run: |
          for pkg in agent-core-bus agent-core-briefs agent-core-busproxy agent-core-channel \
                     agent-core-credentials agent-core-discord agent-core-hatchery \
                     agent-core-inbound agent-core-notify agent-core-qa \
                     agent-core-voice agent-core-webcam; do
            uv build --package "$pkg" --out-dir dist/
          done

      - name: Validate distribution metadata
        run: uvx twine check dist/*

      - name: List built artifacts
        run: ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  # Publishes all 12 packages with an account-scoped API token
  # (secret PYPI_API_TOKEN). A token is used for the initial publish because
  # PyPI caps an account at 3 pending Trusted Publishers, so a 12-package
  # monorepo cannot pre-register OIDC publishers for every project. Once the
  # projects exist, they can be switched to tokenless OIDC (project-scoped
  # publishers, no cap) and this token removed.
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  upload-github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Export pinned requirements (cu130 extra)
        run: |
          uv export --frozen --no-dev --extra cu130 --no-emit-workspace \
                    --no-hashes --format requirements-txt \
                    > dist/requirements.txt

      - name: Upload artifacts to GH Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} dist/*.whl dist/requirements.txt
