name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to validate (e.g. v0.3.1). Leave empty to use the default.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  install-keystone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv python install 3.12
      - run: uv sync --locked --all-packages
      - run: uv run pytest packages/agent-core-qa/tests/ -v -m slow --no-cov -n0
        env:
          AGENT_CORE_QA_RELEASE_TAG: ${{ inputs.release_tag || 'v0.3.0' }}
