name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
      - run: uv sync --locked --all-packages
      - run: just check
      # Patch-coverage gate: fail PRs whose diff drops below 80% covered.
      # Runs only on PRs (push-to-main has no meaningful base to diff) and
      # only on Linux (the coverage.xml shape is identical across OSes so
      # one OS is enough; saves Windows runner time).
      - name: diff-cover patch-level gate
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80
      - run: uv cache prune --ci

  integration:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
      # The slow tests shell out to `uv venv --python 3.12`; ensure a managed CPython exists
      - run: uv python install 3.12
      # --package agent-core intentionally excludes agent-core-voice/qwen-tts (no Torch in CI)
      - run: uv sync --locked --package agent-core
      # Scoped to packages/core/tests — the only location of slow-marked tests today.
      # --no-cov disables coverage for this subset run; the project-wide coverage
      # floor is enforced by the `check` job above, which runs the full suite.
      - run: uv run --no-sync pytest packages/core/tests -m slow -v --no-cov
