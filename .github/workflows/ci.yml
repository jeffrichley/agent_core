name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
      - run: uv sync --locked --all-packages
      - run: just check
      # Upload coverage to Codecov (Linux job only — one upload per run keeps
      # us under the free tier's 250 private-repo uploads/month). Uses the
      # CODECOV_TOKEN secret if set, else the installed Codecov GitHub App
      # (tokenless). Never reddens CI: fail_ci_if_error is false.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      # Patch-coverage gate: fail PRs whose diff drops below 80% covered.
      # Runs only on PRs (push-to-main has no meaningful base to diff) and
      # only on Linux (the coverage.xml shape is identical across OSes so
      # one OS is enough; saves Windows runner time).
      - name: diff-cover patch-level gate
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80
      - run: uv cache prune --ci

  slow-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
      # The slow tests shell out to `uv venv --python 3.12`; ensure a managed CPython exists
      - run: uv python install 3.12
      # --package agent-core (+ agent-core-busproxy) intentionally excludes
      # agent-core-voice/qwen-tts (no Torch in CI). busproxy is light (fastmcp,
      # httpx, anyio) and hosts the real-subprocess/dead-port slow tests.
      - run: uv sync --locked --package agent-core --package agent-core-busproxy
      # Slow-marked tests live in packages/core/tests and packages/agent-core-busproxy/tests.
      # --no-cov disables coverage for this subset run; the project-wide coverage
      # floor is enforced by the `check` job above, which runs the full suite.
      - run: uv run --no-sync pytest packages/core/tests packages/agent-core-busproxy/tests -m slow -v --no-cov
