# Root pyproject — agent-core workspace (uv).
# Member packages live under packages/*. Each owns its [project] metadata.
# This file holds: workspace declaration, dev deps, shared ruff/pytest config.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agent-core = { workspace = true }
agent-core-notify = { workspace = true }
agent-core-credentials = { workspace = true }
agent-core-discord = { workspace = true }
agent-core-channel = { workspace = true }
agent-core-briefs = { workspace = true }
agent-core-webcam = { workspace = true }

[dependency-groups]
# Dev tools only; real package deps live in member pyprojects.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "looptime>=0.7",
    "freezegun>=1.5",
    "ruff>=0.14",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-psutil>=7.0.0.20251001",
    "import-linter>=2.0",
    "towncrier>=23.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/core/src",
    "packages/notify/src",
    "packages/credentials/src",
    "packages/agent-core-channel/src",
]
extend-exclude = [
    ".venv",
    ".uv-cache-local",
    ".tmp",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "I",
    "UP",
    "B",
    "RUF100",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = [
    "packages/core/src",
    "packages/agent-core-channel/src",
]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "packages/credentials/tests",
    "packages/agent-core-discord/tests",
    "packages/agent-core-channel/tests",
]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
markers = [
    "looptime: virtual asyncio clock compaction (looptime plugin; see test docs)",
]
