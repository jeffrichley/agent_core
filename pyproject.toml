# Root pyproject — agent-core workspace (uv).
# Member packages live under packages/*. Each owns its [project] metadata.
# This file holds: workspace declaration, dev deps, shared ruff/pytest config.

[tool.uv.workspace]
members = [
    "packages/*",
    "packages/agent-core-voice/vendor/Qwen3-TTS",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
agent-core-bus = { workspace = true }
agent-core-notify = { workspace = true }
agent-core-credentials = { workspace = true }
agent-core-discord = { workspace = true }
agent-core-channel = { workspace = true }
agent-core-briefs = { workspace = true }
agent-core-webcam = { workspace = true }
agent-core-hatchery = { workspace = true }
agent-core-inbound = { workspace = true }
agent-core-voice = { workspace = true }
agent-core-busproxy = { workspace = true }
qwen-tts = { workspace = true }
torch = [
  { index = "pytorch-cu130", extra = "cu130" },
]

[dependency-groups]
# Dev tools only; real package deps live in member pyprojects.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-randomly>=3.15",
    "pytest-cov>=5.0",
    "pytest-clarity>=1.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "diff-cover>=9.0",
    "looptime>=0.7",
    "freezegun>=1.5",
    "ruff>=0.14",
    "mypy>=2.1.0",
    "types-PyYAML>=6.0",
    "types-psutil>=7.0.0.20251001",
    "import-linter>=2.0",
]
# Documentation site toolchain. Kept out of `dev` so CI test jobs stay lean;
# install in isolation with `uv sync --only-group docs` (no torch/workspace).
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-llmstxt>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/core/src",
    "packages/notify/src",
    "packages/credentials/src",
    "packages/agent-core-channel/src",
]
extend-exclude = [
    ".venv",
    ".uv-cache-local",
    ".tmp",
    "packages/agent-core-voice/vendor",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "I",
    "UP",
    "B",
    "RUF100",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = [
    "packages/core/src",
    "packages/agent-core-channel/src",
    "packages/agent-core-discord/src",
    "packages/agent-core-hatchery/src",
    "packages/agent-core-voice/src",
]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# discord.py publishes no type stubs — silence the missing-import noise so the
# strict override below can focus on our own code.
[[tool.mypy.overrides]]
module = ["discord", "discord.*"]
ignore_missing_imports = true

# agent-core-discord is held to full --strict (issue #444). The strict flags
# are listed individually rather than via the `strict = true` umbrella: in a
# per-module override the umbrella leaks several flags (e.g.
# disallow_any_generics) to the other packages in `files`, whereas the
# individual booleans scope correctly to this module pattern only. Keeps
# packages/core + agent-core-channel on their lighter flag set.
[[tool.mypy.overrides]]
module = ["agent_core_discord.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# questionary ships no py.typed marker and no type stubs on PyPI — silence
# missing-import noise so strict flags can focus on our own code in wizard.py.
[[tool.mypy.overrides]]
module = ["questionary", "questionary.*"]
ignore_missing_imports = true

# agent-core-hatchery is held to full --strict (issue #491). Individual flags
# rather than `strict = true` for the same scoping reason as discord above.
[[tool.mypy.overrides]]
module = ["agent_core_hatchery.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# madrigal 0.2.0 ships no py.typed marker — silence missing-import noise so
# the strict override below can focus on our own code.
[[tool.mypy.overrides]]
module = ["madrigal", "madrigal.*"]
ignore_missing_imports = true

# soundfile 0.13.1 ships as a single .py file with no stubs and no py.typed.
[[tool.mypy.overrides]]
module = ["soundfile"]
ignore_missing_imports = true

# agent-core-voice is held to full --strict (issue #493). Individual flags
# rather than `strict = true` for the same scoping reason as discord above.
[[tool.mypy.overrides]]
module = ["agent_core_voice.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "packages/credentials/tests",
    "packages/agent-core-discord/tests",
    "packages/agent-core-channel/tests",
    "packages/agent-core-inbound/tests",
    "packages/agent-core-webcam/tests",
    "packages/agent-core-voice/tests",
    "packages/agent-core-busproxy/tests",
    "packages/agent-core-hatchery/tests",
]
asyncio_mode = "auto"
# --cov-fail-under=75: whole-repo floor on SOURCE-only coverage (test dirs are
# omitted — see [tool.coverage.run]). Source is ~80% in the fast lane (slow
# real-I/O tests are deselected here and cover more), so 75 is a stable backstop
# with headroom; the diff-cover patch gate (80% of changed lines) does the real
# per-change enforcement. Was 85 when test files inflated the measured total.
addopts = "--import-mode=importlib -m 'not slow' --cov=packages --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=75 -n auto --dist=loadscope"
# Google's "small test" cap. Anything legitimately slower belongs in the
# slow-marker lane (which the addopts above filters out by default).
# Override per-test via @pytest.mark.timeout(N) with a justification.
# thread method works on Windows + Linux equally (signal-based does not).
timeout = 60
timeout_method = "thread"
# NOTE: this `markers` list belongs to [tool.pytest.ini_options] — it was
# previously misfiled under [tool.coverage.run], so pytest never registered
# these marks (every @pytest.mark.slow emitted PytestUnknownMarkWarning and
# coverage warned about an unrecognized option). The `-m 'not slow'` filter
# worked regardless because mark *expressions* don't require registration.
markers = [
    "looptime: virtual asyncio clock compaction (looptime plugin; see test docs)",
    "slow: a test that takes more than ~1s OR does real I/O (subprocess, network, sleep, or heavy crypto like an un-tuned KDF). Google's 'small test' lives in the default lane; anything slower or I/O-bound is excluded from it (addopts: -m 'not slow') and runs in the slow-tests CI job instead. Slow-by-accident tests should be made fast, not marked.",
]

[tool.coverage.run]
# Exclude vendored code + generated stubs from coverage measurement.
# Test files are NOT measured: coverage should reflect how well *source* is
# exercised, not whether test code ran. Measuring test dirs also broke the
# patch-coverage (diff-cover) gate — a slow-marked test that the default lane
# skips showed as "uncovered", failing PRs whose *source* was well-tested
# (agent_core#296).
omit = [
    "*/vendor/*",
    "*/.venv/*",
    "*/__pycache__/*",
    "*/tests/*",
]

