# Root pyproject — agent-core workspace (uv).
# Member packages live under packages/*. Each owns its [project] metadata.
# This file holds: workspace declaration, dev deps, shared ruff/pytest config.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agent-core = { workspace = true }
agent-core-notify = { workspace = true }
agent-core-credentials = { workspace = true }
agent-core-discord = { workspace = true }

[dependency-groups]
# Dev tools only; real package deps live in member pyprojects.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.5",
    "ruff>=0.14",
    "import-linter>=2.0",
    "towncrier>=23.11",
]

[tool.ruff]
line-length = 100
src = ["packages/core/src", "packages/notify/src", "packages/credentials/src"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/credentials/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
